name: k6 Load & Performance Testing (KinD)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Select k6 performance suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - load_test.js
          - spike_test.js
          - soak_test.js

jobs:
  k6-performance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Backend Jar
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Build Docker Images
        run: |
          docker build -t url-shortener-backend:latest ./backend
          docker build -t url-shortener-frontend:latest ./frontend

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          wait: 120s

      - name: Load Docker Images into KinD
        run: |
          kind load docker-image url-shortener-backend:latest --name kind
          kind load docker-image url-shortener-frontend:latest --name kind

      - name: Install Metrics Server (for HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
          kubectl rollout status deployment metrics-server -n kube-system --timeout=120s

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Wait for Kubernetes Deployments to be Ready
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/valkey --timeout=180s
          kubectl rollout status deployment/url-shortener-backend --timeout=300s
          kubectl rollout status deployment/url-shortener-frontend --timeout=180s

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Performance Test Suites
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || 'all' }}
        run: |
          run_suite() {
            SUITE_NAME=$1
            SUMMARY_FILE=$2
            
            echo "=========================================="
            echo "🚀 Executing: ${SUITE_NAME}"
            echo "=========================================="
            
            pkill -f "port-forward" || true
            sleep 1
            kubectl port-forward svc/url-shortener-backend-service 8080:8080 &
            PF_PID=$!
            sleep 3
            
            API_URL=http://localhost:8080 k6 run --summary-export=${SUMMARY_FILE} load_tests/${SUITE_NAME} || true
            
            kill $PF_PID || true
          }

          MODE="${RUN_MODE:-all}"

          if [ "$MODE" = "all" ] || [ "$MODE" = "load_test.js" ]; then
            run_suite "load_test.js" "k6-summary-load.json"
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "spike_test.js" ]; then
            run_suite "spike_test.js" "k6-summary-spike.json"
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "soak_test.js" ]; then
            run_suite "soak_test.js" "k6-summary-soak.json"
          fi

      - name: Generate Executive Summary & Incremental File Update
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
          const fs = require("fs");
          const suites = [
            { id: "load", name: "Standard Load Test", file: "k6-summary-load.json" },
            { id: "spike", name: "Spike Burst Test", file: "k6-summary-spike.json" },
            { id: "soak", name: "Soak / Endurance Test", file: "k6-summary-soak.json" }
          ];

          const resultsFile = "load_tests/PERFORMANCE_RESULTS.md";

          let currentData = {
            "Standard Load Test": { reqs: "1,428,991", rps: "3966.7 req/s", passRate: "4.64%", avgLat: "450.1ms", p95Lat: "2655.0ms", status: "⚠️ HEAVY LOAD" },
            "Spike Burst Test": { reqs: "96,836", rps: "318.8 req/s", passRate: "79.78%", avgLat: "1653.3ms", p95Lat: "8020.4ms", status: "⚠️ HEAVY LOAD" },
            "Soak / Endurance Test": { reqs: "688,214", rps: "1636.7 req/s", passRate: "99.99%", avgLat: "272.1ms", p95Lat: "906.7ms", status: "✅ PASSED" }
          };

          if (fs.existsSync(resultsFile)) {
            const content = fs.readFileSync(resultsFile, "utf8");
            content.split("\n").forEach(line => {
              const m = line.match(/^\|\s*\*\*([^*]+)\*\*\s*\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|/);
              if (m) {
                const sName = m[1].trim();
                currentData[sName] = {
                  reqs: m[2].trim(),
                  rps: m[3].trim(),
                  passRate: m[4].trim(),
                  avgLat: m[5].trim(),
                  p95Lat: m[6].trim(),
                  status: m[7].trim()
                };
              }
            });
          }

          const getMetric = (m, key) => m && m[key] ? (m[key].values || m[key]) : null;

          suites.forEach(s => {
            if (fs.existsSync(s.file)) {
              try {
                const data = JSON.parse(fs.readFileSync(s.file, "utf8"));
                const m = data.metrics || {};
                
                const httpReqs = getMetric(m, "http_reqs");
                const reqs = httpReqs && httpReqs.count ? httpReqs.count.toLocaleString() : "0";
                const rps = httpReqs && httpReqs.rate ? `${httpReqs.rate.toFixed(1)} req/s` : "0 req/s";
                
                const dur = getMetric(m, "http_req_duration{expected_response:true}") || getMetric(m, "http_req_duration");
                const avgLat = dur && dur.avg ? `${dur.avg.toFixed(1)}ms` : "N/A";
                const p95Lat = dur && dur["p(95)"] !== undefined ? `${dur["p(95)"].toFixed(1)}ms` : "N/A";
                
                const failed = getMetric(m, "http_req_failed");
                let passRate = "100%";
                if (failed) {
                  const ok = failed.fails || 0;
                  const total = (failed.passes || 0) + ok;
                  passRate = total > 0 ? `${((ok / total) * 100).toFixed(2)}%` : "100%";
                }
                
                const failRatio = failed && failed.value !== undefined ? failed.value : 0;
                const status = failRatio < 0.05 ? "✅ PASSED" : "⚠️ HEAVY LOAD";
                
                currentData[s.name] = { reqs, rps, passRate, avgLat, p95Lat, status };
              } catch (e) {
                console.error("Error parsing " + s.file, e);
              }
            }
          });

          let tableMd = "| Test Suite | Total Requests | Throughput (RPS) | Success Rate | Avg Latency | p95 Latency | Status |\n";
          tableMd += "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n";

          suites.forEach(s => {
            const d = currentData[s.name] || { reqs: "N/A", rps: "N/A", passRate: "N/A", avgLat: "N/A", p95Lat: "N/A", status: "⚠️ Pending" };
            tableMd += `| **${s.name}** | ${d.reqs} | ${d.rps} | ${d.passRate} | ${d.avgLat} | ${d.p95Lat} | ${d.status} |\n`;
          });

          const timestamp = new Date().toISOString();
          let md = `# 📊 Automated k6 Performance Test Results\n\n`;
          md += `> **Last Automated Run:** \`${timestamp}\`  \n`;
          md += `> **Git Commit:** \`${process.env.COMMIT_SHA || "local"}\`  \n`;
          md += `> **Branch:** \`${process.env.REF_NAME || "main"}\`  \n\n`;
          md += `---  \n\n`;
          md += `## 🚀 Executive Benchmark Summary\n\n` + tableMd;

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          fs.writeFileSync(resultsFile, md);
          '

      - name: Commit & Push PERFORMANCE_RESULTS.md to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "docs(ci): update automated k6 performance test results [skip ci]"
          file_pattern: "load_tests/PERFORMANCE_RESULTS.md"

      - name: Upload k6 Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-all-summary-reports
          path: k6-summary-*.json
