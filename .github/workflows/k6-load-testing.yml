name: Tier B — Capacity (k6 on KinD)

# TIER B of the three-tier strategy (see plan.md Stage 7).
#
# READ THIS BEFORE QUOTING ANY NUMBER FROM THIS WORKFLOW.
#
# A GitHub Actions runner is 2-4 vCPU in total, and here it hosts Postgres, Valkey, every
# backend JVM AND k6 itself. At a few thousand VUs the generator alone saturates the box, so
# these figures describe the runner at least as much as the application. They are a REGRESSION
# signal across commits on identical hardware -- not a capacity claim.
#
# Real capacity numbers need a multi-node cluster with load driven from a separate machine.
# See load_tests/BASELINE.md.

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Select k6 performance suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - load_test.js
          - spike_test.js
          - soak_test.js

jobs:
  k6-performance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Backend Jar
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # The backend image now packages the jar built above rather than recompiling from source
      # inside Docker, so CI compiles once.
      - name: Build Docker Images
        run: |
          docker build -t url-shortener-backend:latest ./backend
          docker build -t url-shortener-frontend:latest ./frontend

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          wait: 120s

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Load Docker Images into KinD
        run: |
          kind load docker-image url-shortener-backend:latest --name kind
          kind load docker-image url-shortener-frontend:latest --name kind

      - name: Install Metrics Server (for HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
          kubectl rollout status deployment metrics-server -n kube-system --timeout=120s

      # Same chart and same Spring profile as production. The loadtest overlay changes only
      # replica ceilings and resource sizing -- rate-limit quotas are now the production ones,
      # with the generator allowlisted by shared secret instead.
      - name: Deploy via Helm
        run: |
          helm upgrade --install urlshortener ./chart \
            -f chart/values-loadtest.yaml \
            --wait --timeout 10m

          echo "### Deployed configuration" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Runner                : $(nproc) vCPU, $(free -g | awk '/^Mem:/{print $2}') GB RAM (hosts the cluster AND k6)" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap urlshortener-config -o jsonpath='{.data.HIKARI_MAX_POOL_SIZE}' \
            | xargs -I{} echo "HikariCP pool per pod : {}" >> $GITHUB_STEP_SUMMARY
          kubectl get configmap urlshortener-config -o jsonpath='{.data.DB_BULKHEAD_MAX_CONCURRENT}' \
            | xargs -I{} echo "DB bulkhead           : {}" >> $GITHUB_STEP_SUMMARY
          kubectl get hpa urlshortener-backend \
            -o jsonpath='HPA replicas          : {.spec.minReplicas}-{.spec.maxReplicas}{"\n"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Record pre-test HPA state
        run: kubectl get hpa urlshortener-backend -o wide

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Performance Test Suites
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || 'all' }}
          # Quotas stay at production values; the generator is allowlisted. Without this, a
          # per-IP limiter correctly reads k6 as a single-source flood and the run measures
          # the limiter rather than the service.
          RATE_LIMIT_BYPASS_SECRET: ci_loadgen_bypass_secret
        run: |
          run_suite() {
            SUITE_NAME=$1
            SUMMARY_FILE=$2

            echo "=========================================="
            echo "🚀 Executing: ${SUITE_NAME}"
            echo "=========================================="

            pkill -f "port-forward" || true
            sleep 1
            kubectl port-forward svc/urlshortener-backend 8080:8080 &
            PF_PID=$!
            sleep 3

            API_URL=http://localhost:8080 k6 run --summary-export=${SUMMARY_FILE} load_tests/${SUITE_NAME} || true

            kill $PF_PID || true
          }

          MODE="${RUN_MODE:-all}"

          if [ "$MODE" = "all" ] || [ "$MODE" = "load_test.js" ]; then
            run_suite "load_test.js" "k6-summary-load.json"
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "spike_test.js" ]; then
            run_suite "spike_test.js" "k6-summary-spike.json"
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "soak_test.js" ]; then
            run_suite "soak_test.js" "k6-summary-soak.json"
          fi

      - name: Capture autoscaling, connection and queue evidence
        if: always()
        run: |
          echo "### Autoscaling evidence" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get hpa urlshortener-backend -o wide 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend pods at end of run: $(kubectl get pods -l app.kubernetes.io/component=backend --no-headers | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Proves the pool/max_connections invariant held under peak load -- the failure mode
          # that previously capped success near 88%.
          echo "### Postgres connection usage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl exec urlshortener-postgres-0 -- \
            psql -U postgres -d url_shortener -t \
            -c "SELECT count(*) AS connections, (SELECT setting FROM pg_settings WHERE name='max_connections') AS max FROM pg_stat_activity;" \
            2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Did analytics keep up? A stream that drained is the difference between "clicks were
          # recorded" and "clicks were accepted and quietly dropped at MAXLEN".
          echo "### Analytics drain" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl exec urlshortener-valkey-0 -- valkey-cli XLEN analytics:click:stream 2>&1 \
            | sed 's/^/stream length: /' >> $GITHUB_STEP_SUMMARY || true
          kubectl exec urlshortener-postgres-0 -- psql -U postgres -d url_shortener -t \
            -c "SELECT count(*) AS clicks_persisted FROM url_clicks;" 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          kubectl logs -l app.kubernetes.io/component=backend --tail=50 --prefix 2>&1 \
            | grep -i "SQLTransientConnectionException\|connection is not available" \
            && echo "::warning::Connection pool exhaustion detected" || echo "No pool exhaustion detected"

      - name: Generate Executive Summary & Incremental File Update
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
          const fs = require("fs");
          const suites = [
            { name: "Standard Load Test",   file: "k6-summary-load.json"  },
            { name: "Spike Burst Test",     file: "k6-summary-spike.json" },
            { name: "Soak / Endurance Test", file: "k6-summary-soak.json"  }
          ];

          const num = (v, digits = 1) => (v === undefined || v === null) ? "n/a" : v.toFixed(digits);
          const ms  = (v) => v === undefined ? "n/a" : num(v) + " ms";
          const pct = (v) => v === undefined ? "n/a" : num(v * 100, 2) + "%";

          let rows = "";
          for (const s of suites) {
            if (!fs.existsSync(s.file)) {
              rows += `| **${s.name}** | not run | | | | | |\n`;
              continue;
            }
            const m = JSON.parse(fs.readFileSync(s.file, "utf8")).metrics || {};
            const reqs     = (m.http_reqs || {}).count;
            const rps      = (m.http_reqs || {}).rate;
            const redirect = (m.redirect_duration || {})["p(95)"];
            const create   = (m.create_duration   || {})["p(95)"];
            const hit      = (m.redirect_cache_hit || {}).value;
            const failed   = (m.redirect_failed    || {}).value;
            const shed     = (m.responses_503 || {}).count || 0;
            const status   = (failed !== undefined && failed < 0.01) ? "✅" : "⚠️";
            rows += `| **${s.name}** | ${reqs ? reqs.toLocaleString() : "n/a"} | ${num(rps)} req/s | `
                  + `${ms(redirect)} | ${ms(create)} | ${pct(hit)} | ${pct(failed)} | ${shed} | ${status} |\n`;
          }

          let md = "# 📊 Tier B — Capacity suite (constrained single-node CI)\n\n";
          md += "> **Last run:** `" + new Date().toISOString() + "`  \n";
          md += "> **Commit:** `" + (process.env.COMMIT_SHA || "local") + "`  \n";
          md += "> **Branch:** `" + (process.env.REF_NAME || "main") + "`  \n";
          md += "> **Hardware:** one GitHub Actions runner (2–4 vCPU) hosting KinD, Postgres, Valkey,\n";
          md += "> every backend pod **and** k6 itself.\n\n";
          md += "**These are regression numbers, not capacity numbers.** The generator competes with the\n";
          md += "system under test for the same handful of cores, so absolute latency here is dominated by\n";
          md += "the runner. Compare them across commits, never against a real deployment.\n\n";
          md += "| Test Suite | Requests | Throughput | Redirect p95 | Create p95 | Cache hit | Redirect errors | 503s shed | |\n";
          md += "| :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | :-: |\n";
          md += rows;
          md += "\nRedirect and create latency are reported separately because they are different\n";
          md += "operations: one is a cache read, the other a Postgres write. A single blended p95 hides\n";
          md += "both. Cache hit ratio is read from the `X-Cache` response header, not assumed.\n";

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          fs.writeFileSync("load_tests/PERFORMANCE_RESULTS.md", md);
          '

      - name: Commit & Push PERFORMANCE_RESULTS.md to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "docs(ci): update Tier B capacity results [skip ci]"
          file_pattern: "load_tests/PERFORMANCE_RESULTS.md"

      - name: Upload k6 Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-all-summary-reports
          path: k6-summary-*.json
