name: k6 Load & Performance Testing (KinD)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Test mode'
        required: true
        default: 'spike_and_soak'
        type: choice
        options:
          - spike_and_soak
          - spike_test.js
          - soak_test.js
          - load_test.js
          - all

jobs:
  k6-performance-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Backend Jar
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Build Docker Images
        run: |
          docker build -t url-shortener-backend:latest ./backend
          docker build -t url-shortener-frontend:latest ./frontend

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          wait: 120s

      - name: Load Docker Images into KinD
        run: |
          kind load docker-image url-shortener-backend:latest --name kind
          kind load docker-image url-shortener-frontend:latest --name kind

      - name: Install Metrics Server (for HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
          kubectl rollout status deployment metrics-server -n kube-system --timeout=120s

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Wait for Kubernetes Deployments to be Ready
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/valkey --timeout=180s
          kubectl rollout status deployment/url-shortener-backend --timeout=300s
          kubectl rollout status deployment/url-shortener-frontend --timeout=180s

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Performance Test Suites
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || 'all' }}
        run: |
          run_suite() {
            SUITE_NAME=$1
            SUMMARY_FILE=$2
            
            echo "=========================================="
            echo "🚀 Executing: ${SUITE_NAME}"
            echo "=========================================="
            
            pkill -f "port-forward" || true
            sleep 1
            kubectl port-forward svc/url-shortener-backend-service 8080:8080 &
            PF_PID=$!
            sleep 3
            
            API_URL=http://localhost:8080 k6 run --summary-export=${SUMMARY_FILE} load_tests/${SUITE_NAME} || true
            
            kill $PF_PID || true
          }

          MODE="${RUN_MODE:-spike_and_soak}"

          if [ "$MODE" = "all" ] || [ "$MODE" = "load_test.js" ]; then
            run_suite "load_test.js" "k6-summary-load.json"
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "spike_and_soak" ] || [ "$MODE" = "spike_test.js" ]; then
            run_suite "spike_test.js" "k6-summary-spike.json"
          fi

          if [ "$MODE" = "all" ] || [ "$MODE" = "spike_and_soak" ] || [ "$MODE" = "soak_test.js" ]; then
            run_suite "soak_test.js" "k6-summary-soak.json"
          fi

      - name: Generate Executive Summary & Save to File
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
          const fs = require("fs");
          const suites = [
            { name: "Standard Load Test", file: "k6-summary-load.json" },
            { name: "Spike Burst Test", file: "k6-summary-spike.json" },
            { name: "Soak / Endurance Test", file: "k6-summary-soak.json" }
          ];

          const timestamp = new Date().toISOString();
          let tableMd = "| Test Suite | Total Requests | Throughput (RPS) | Success Rate | Avg Latency | p95 Latency | Status |\n";
          tableMd += "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n";

          const getMetric = (m, key) => m && m[key] ? (m[key].values || m[key]) : null;

          suites.forEach(s => {
            if (!fs.existsSync(s.file)) {
              tableMd += `| **${s.name}** | N/A | N/A | N/A | N/A | N/A | ⚠️ Skipped |\n`;
              return;
            }
            try {
              const data = JSON.parse(fs.readFileSync(s.file, "utf8"));
              const m = data.metrics || {};
              
              const httpReqs = getMetric(m, "http_reqs");
              const reqs = httpReqs && httpReqs.count ? httpReqs.count : 0;
              const rps = httpReqs && httpReqs.rate ? httpReqs.rate.toFixed(1) : "0";
              
              const dur = getMetric(m, "http_req_duration{expected_response:true}") || getMetric(m, "http_req_duration");
              const avgLat = dur && dur.avg ? `${dur.avg.toFixed(1)}ms` : "N/A";
              const p95Lat = dur && dur["p(95)"] !== undefined ? `${dur["p(95)"].toFixed(1)}ms` : "N/A";
              
              const failed = getMetric(m, "http_req_failed");
              let passRate = "100%";
              if (failed) {
                const ok = failed.fails || 0;
                const total = (failed.passes || 0) + ok;
                passRate = total > 0 ? `${((ok / total) * 100).toFixed(2)}%` : "100%";
              }
              
              const failRatio = failed && failed.value !== undefined ? failed.value : 0;
              const status = failRatio < 0.05 ? "✅ PASSED" : "⚠️ HEAVY LOAD";
              
              tableMd += `| **${s.name}** | ${reqs.toLocaleString()} | ${rps} req/s | ${passRate} | ${avgLat} | ${p95Lat} | ${status} |\n`;
            } catch (e) {
              tableMd += `| **${s.name}** | Parsing Error | - | - | - | - | ❌ Error |\n`;
            }
          });

          let md = `# 📊 Automated k6 Performance Test Results\n\n`;
          md += `> **Last Automated Run:** \`${timestamp}\`  \n`;
          md += `> **Git Commit:** \`${process.env.COMMIT_SHA || "local"}\`  \n`;
          md += `> **Branch:** \`${process.env.REF_NAME || "main"}\`  \n\n`;
          md += `---  \n\n`;
          md += `## 🚀 Executive Benchmark Summary\n\n` + tableMd;

          // Write to GitHub Step Summary Card
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);

          // Save to repository file load_tests/PERFORMANCE_RESULTS.md
          fs.writeFileSync("load_tests/PERFORMANCE_RESULTS.md", md);
          '

      - name: Commit & Push PERFORMANCE_RESULTS.md to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        with:
          commit_message: "docs(ci): update automated k6 performance test results [skip ci]"
          file_pattern: "load_tests/PERFORMANCE_RESULTS.md"

      - name: Upload k6 Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-all-summary-reports
          path: k6-summary-*.json
