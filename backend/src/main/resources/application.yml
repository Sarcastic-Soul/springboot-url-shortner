spring:
  application:
    name: url-shortener

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379

server:
  tomcat:
    threads:
      max: 1000
    accept-count: 2000

app:
  base-url: http://localhost:8080
  anonymous:
    max-expiry-days: 7
  url-safety:
    blocked-domains:
      - phishing.test
      - malware.test
  geoip:
    database-path:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    anonymous:
      capacity: 100000
      refill-tokens: 100000
      refill-duration-minutes: 1
    authenticated:
      capacity: 100000
      refill-tokens: 100000
      refill-duration-minutes: 1
  redirect-cache:
    ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:6af69b2bbd4f4eecb14af72dfad91e0c71c73f8271dc3db889d9b2d0d8dffb86}
  access-token-expiration: ${JWT_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

