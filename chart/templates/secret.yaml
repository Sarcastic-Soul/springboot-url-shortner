apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urlshortener.fullname" . }}-secret
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{/* No defaults: a missing secret must fail the install loudly. */}}
  POSTGRES_USER: {{ include "urlshortener.requireSecret" (dict "Values" .Values "key" "postgresUser") | quote }}
  POSTGRES_PASSWORD: {{ include "urlshortener.requireSecret" (dict "Values" .Values "key" "postgresPassword") | quote }}
  JWT_SECRET: {{ include "urlshortener.requireSecret" (dict "Values" .Values "key" "jwtSecret") | quote }}
  {{- if .Values.secrets.rateLimitBypassSecret }}
  {{/* Load generators only. Absent in production, where nothing may bypass the limiter. */}}
  RATE_LIMIT_BYPASS_SECRET: {{ .Values.secrets.rateLimitBypassSecret | quote }}
  {{- end }}
