{{- if .Values.metrics.serviceMonitor.enabled }}
{{/*
Requires the Prometheus Operator CRDs, which come from chart/observability. Off by default so
`helm template` and a bare cluster both stay working.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "urlshortener.fullname" . }}-backend
  labels:
    {{- include "urlshortener.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
