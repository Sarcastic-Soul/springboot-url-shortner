services:
  postgres:
    image: postgres:17-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-url_shortener}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    command: postgres -c max_connections=200
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: url-shortener-valkey
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend-1:
    build: ./backend
    container_name: backend-1
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-url_shortener}
      - SPRING_DATA_REDIS_HOST=valkey
    depends_on:
      - postgres
      - valkey
    restart: unless-stopped

  backend-2:
    build: ./backend
    container_name: backend-2
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-url_shortener}
      - SPRING_DATA_REDIS_HOST=valkey
    depends_on:
      - postgres
      - valkey
    restart: unless-stopped

  backend-3:
    build: ./backend
    container_name: backend-3
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-url_shortener}
      - SPRING_DATA_REDIS_HOST=valkey
    depends_on:
      - postgres
      - valkey
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: url-shortener-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: url-shortener-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://nginx:8080
    depends_on:
      - nginx
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
